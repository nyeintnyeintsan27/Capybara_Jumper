<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Capybara Runner 🐹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .game-wrapper {
            background: #16213e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 2px solid #e94560;
        }
        canvas {
            border: 3px solid #e94560;
            border-radius: 12px;
            display: block;
            background: #87CEEB;
            cursor: pointer;
        }
        .ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            color: #eee;
            font-size: 18px;
            padding: 0 10px;
        }
        .ui span {
            background: #0f3460;
            padding: 8px 20px;
            border-radius: 10px;
            border: 1px solid #e94560;
        }
        .ui button {
            padding: 10px 30px;
            font-size: 18px;
            font-weight: bold;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .ui button:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }
        .controls {
            color: #aaa;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }
        .controls kbd {
            background: #0f3460;
            padding: 4px 12px;
            border-radius: 5px;
            border: 1px solid #e94560;
            color: #fff;
        }
        #gameOverMsg {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 22px;
        }
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 8px;
            font-size: 13px;
            color: #ccc;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-color {
            width: 20px;
            height: 16px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="ui">
        <span>🏆 <span id="scoreDisplay">0</span></span>
        <span id="gameOverMsg"></span>
        <button onclick="restartGame()">🔄 Restart</button>
    </div>
    <div class="controls">
        <kbd>Space</kbd> သို့ <kbd>↑</kbd> နှိပ်ပြီး ခုန်ပါ။
    </div>
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background:#8D6E63;"></div>
            <span>🧱 Jump </span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#4CAF50;"></div>
            <span>🌿 Keep </span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:linear-gradient(90deg,#8D6E63,#4CAF50);"></div>
            <span>⚠️As You Like</span>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const gameOverMsg = document.getElementById('gameOverMsg');

    const capybaraImg = new Image();
    capybaraImg.src = 'image.png';
    let capybaraLoaded = false;
    capybaraImg.onload = function() {
        capybaraLoaded = true;
    };
    capybaraImg.onerror = function() {
        capybaraLoaded = false;
    };

    let gameRunning = true;
    let score = 0;
    let frame = 0;
    let speed = 4;
    let spawnCounter = 0;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -15.5;
    const GROUND_Y = 335;

    const capybara = {
        x: 80,
        y: 300,
        width: 48,
        height: 40,
        vy: 0,
        isJumping: false,
        runFrame: 0,

        draw() {
            if (capybaraLoaded) {
                const drawY = this.y - 5;
                ctx.drawImage(capybaraImg, this.x - 4, drawY, this.width + 8, this.height + 10);
                if (this.isJumping) {
                    ctx.save();
                    ctx.translate(this.x + this.width/2, drawY + this.height/2);
                    ctx.rotate(-0.1);
                    ctx.drawImage(capybaraImg, -this.width/2 - 4, -this.height/2 - 5, this.width + 8, this.height + 10);
                    ctx.restore();
                }
            } else {
                this.drawFallback();
            }
        },

        drawFallback() {
            ctx.fillStyle = '#8B6B4A';
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.ellipse(this.x + 20, this.y + 15, 22, 18, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#A67B5B';
            ctx.beginPath();
            ctx.ellipse(this.x + 35, this.y + 8, 14, 13, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(this.x + 40, this.y + 5, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(this.x + 42, this.y + 4, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(this.x + 43, this.y + 2, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#3d2b1f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x + 38, this.y + 1, 5, Math.PI, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(this.x + 46, this.y + 1, 5, Math.PI, 0);
            ctx.stroke();
            ctx.fillStyle = '#3d2b1f';
            ctx.beginPath();
            ctx.arc(this.x + 46, this.y + 10, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2a1a0e';
            ctx.beginPath();
            ctx.arc(this.x + 48, this.y + 10, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#3d2b1f';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(this.x + 44, this.y + 14, 4, 0.1, 0.6);
            ctx.stroke();
            ctx.fillStyle = '#A67B5B';
            ctx.beginPath();
            ctx.ellipse(this.x + 28, this.y - 2, 5, 8, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(this.x + 38, this.y - 2, 5, 8, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#6B4F3A';
            if (this.isJumping) {
                ctx.fillRect(this.x + 5, this.y + 22, 6, 6);
                ctx.fillRect(this.x + 15, this.y + 22, 6, 6);
                ctx.fillRect(this.x + 28, this.y + 22, 6, 6);
                ctx.fillRect(this.x + 38, this.y + 22, 6, 6);
            } else {
                const legOffset = Math.sin(this.runFrame * 0.2) * 6;
                const legOffset2 = Math.sin(this.runFrame * 0.2 + Math.PI) * 6;
                ctx.fillRect(this.x + 5, this.y + 28 + legOffset, 6, 8);
                ctx.fillRect(this.x + 15, this.y + 28 + legOffset2, 6, 8);
                ctx.fillRect(this.x + 28, this.y + 28 + legOffset2, 6, 8);
                ctx.fillRect(this.x + 38, this.y + 28 + legOffset, 6, 8);
            }
            ctx.fillStyle = '#7A5A3A';
            ctx.beginPath();
            ctx.ellipse(this.x - 2, this.y + 18, 6, 4, -0.5, 0, Math.PI * 2);
            ctx.fill();
            if (!this.isJumping && frame % 8 < 4) {
                ctx.fillStyle = 'rgba(100,200,255,0.4)';
                ctx.beginPath();
                ctx.arc(this.x - 5, this.y + 2, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x - 10, this.y + 8, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        },

        jump() {
            if (!this.isJumping) {
                this.vy = JUMP_FORCE;
                this.isJumping = true;
            }
        },

        update() {
            this.vy += GRAVITY;
            this.y += this.vy;
            if (this.y >= 300) {
                this.y = 300;
                this.vy = 0;
                this.isJumping = false;
            }
            if (!this.isJumping) {
                this.runFrame += 1;
            }
        },

        getBounds() {
            return {
                x: this.x + 6,
                y: this.y + 6,
                width: this.width - 12,
                height: this.height - 8
            };
        }
    };

    const OBSTACLE_TYPES = {
        WALL: 'wall',
        BUSH: 'bush',
        DOUBLE: 'double'
    };

    let obstacles = [];

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.x = 820;
            this.passed = false;
            this.parts = [];
            
            switch(type) {
                case OBSTACLE_TYPES.WALL:
                    this.parts.push({
                        x: 0,
                        width: 30,
                        height: 75,
                        y: 0,
                        requiresJump: true,
                        color: '#8D6E63',
                        label: '🧱'
                    });
                    break;
                    
                case OBSTACLE_TYPES.BUSH:
                    this.parts.push({
                        x: 0,
                        width: 50,
                        height: 30,
                        y: 60,              // ပိုမြင့်အောင်
                        requiresJump: false,
                        color: '#4CAF50',
                        label: '🌿'
                    });
                    break;
                    
                case OBSTACLE_TYPES.DOUBLE:
                    this.parts.push({
                        x: 0,
                        width: 30,
                        height: 75,
                        y: 0,
                        requiresJump: true,
                        color: '#8D6E63',
                        label: '🧱'
                    });
                    this.parts.push({
                        x: 50,
                        width: 45,
                        height: 30,
                        y: 70,              //adjust height to make it more challenging
                        requiresJump: false,
                        color: '#4CAF50',
                        label: '🌿'
                    });
                    break;
            }
        }

        draw() {
            this.parts.forEach(part => {
                const px = this.x + part.x;
                const py = GROUND_Y - part.height - (part.y || 0);
                
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 6;
                
                if (part.requiresJump) {
                    const grad = ctx.createLinearGradient(px, py, px + part.width, py);
                    grad.addColorStop(0, '#8D6E63');
                    grad.addColorStop(0.5, '#A1887F');
                    grad.addColorStop(1, '#8D6E63');
                    ctx.fillStyle = grad;
                    ctx.fillRect(px, py, part.width, part.height);
                    
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#5D4037';
                    ctx.lineWidth = 1.5;
                    
                    for (let row = 0; row < 6; row++) {
                        const ry = py + row * 13;
                        ctx.beginPath();
                        ctx.moveTo(px, ry);
                        ctx.lineTo(px + part.width, ry);
                        ctx.stroke();
                    }
                    
                    for (let row = 0; row < 6; row++) {
                        const offset = row % 2 === 0 ? 0 : part.width / 2;
                        for (let col = 0; col < 2; col++) {
                            const lx = px + col * (part.width / 2) + offset;
                            const ry = py + row * 13;
                            ctx.beginPath();
                            ctx.moveTo(lx, ry);
                            ctx.lineTo(lx, ry + 13);
                            ctx.stroke();
                        }
                    }
                    
                    ctx.fillStyle = '#4E342E';
                    ctx.fillRect(px, py + part.height - 2, part.width, 2);
                    
                    if (this.x < 400) {
                        ctx.fillStyle = `rgba(255,0,0,${0.08 + (1 - this.x/400) * 0.12})`;
                        ctx.fillRect(px - 5, py - 5, part.width + 10, part.height + 10);
                    }
                    
                } else {
                    // ===== မြက်ခုပ် (ပိုမြင့်တဲ့နေရာ) =====
                    ctx.fillStyle = '#388E3C';
                    ctx.beginPath();
                    ctx.ellipse(px + part.width/2, py + part.height/2 + 2, part.width/2.2, part.height/2.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#43A047';
                    ctx.beginPath();
                    ctx.ellipse(px + part.width/3, py + part.height/2 - 2, part.width/4.5, part.height/3.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#66BB6A';
                    ctx.beginPath();
                    ctx.ellipse(px + part.width*2/3, py + part.height/2 + 4, part.width/4.5, part.height/3.8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#FF6B6B';
                    ctx.beginPath();
                    ctx.arc(px + 10, py + 14, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFD93D';
                    ctx.beginPath();
                    ctx.arc(px + 10, py + 14, 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#FF6B6B';
                    ctx.beginPath();
                    ctx.arc(px + 35, py + 10, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFD93D';
                    ctx.beginPath();
                    ctx.arc(px + 35, py + 10, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // အောက်ခြေမှာ သတိပေးလိုင်း
                    ctx.fillStyle = 'rgba(255,0,0,0.15)';
                    ctx.fillRect(px, py + part.height - 2, part.width, 2);
                }
                
                ctx.shadowBlur = 0;
                ctx.font = '18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.fillText(part.label, px + part.width/2, py - 5);
            });
            
            ctx.shadowBlur = 0;
        }

        update() {
            this.x -= speed;
        }

        getPartsBounds() {
            return this.parts.map(part => {
                const px = this.x + part.x;
                const py = GROUND_Y - part.height - (part.y || 0);
                return {
                    x: px + 2,
                    y: py + 2,
                    width: part.width - 4,
                    height: part.height - 4,
                    requiresJump: part.requiresJump
                };
            });
        }

        isOffScreen() {
            return this.x < -100;
        }
        
        isFullyPassed(capX) {
            const lastPart = this.parts[this.parts.length - 1];
            return capX > this.x + lastPart.x + lastPart.width + 10;
        }
    }

    let groundOffset = 0;

    function drawGround() {
        ctx.fillStyle = '#5D8A3C';
        ctx.fillRect(0, GROUND_Y, 800, 65);
        
        ctx.fillStyle = '#7CB342';
        for (let i = 0; i < 20; i++) {
            const x = (i * 42 + groundOffset) % 820 - 20;
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 5, GROUND_Y - 15);
            ctx.lineTo(x + 5, GROUND_Y - 15);
            ctx.closePath();
            ctx.fill();
        }

        ctx.fillStyle = '#4A7A2A';
        ctx.fillRect(0, GROUND_Y + 2, 800, 3);
        
        groundOffset = (groundOffset - speed) % 42;
    }

    function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        gradient.addColorStop(0, '#4A90D9');
        gradient.addColorStop(1, '#87CEEB');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 800, GROUND_Y);

        ctx.fillStyle = '#FFD93D';
        ctx.shadowColor = '#FFD93D';
        ctx.shadowBlur = 40;
        ctx.beginPath();
        ctx.arc(720, 50, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        const cloudX = (frame * 0.3) % 900 - 100;
        ctx.beginPath();
        ctx.arc(cloudX, 60, 30, 0, Math.PI * 2);
        ctx.arc(cloudX + 30, 50, 25, 0, Math.PI * 2);
        ctx.arc(cloudX + 55, 60, 28, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cloudX + 300, 100, 25, 0, Math.PI * 2);
        ctx.arc(cloudX + 325, 90, 20, 0, Math.PI * 2);
        ctx.arc(cloudX + 350, 100, 22, 0, Math.PI * 2);
        ctx.fill();
    }

    function rectCollide(r1, r2) {
        return r1.x < r2.x + r2.width &&
               r1.x + r1.width > r2.x &&
               r1.y < r2.y + r2.height &&
               r1.y + r1.height > r2.y;
    }

    function spawnObstacle() {
        const level = Math.floor(score / 100);
        let types = [OBSTACLE_TYPES.WALL, OBSTACLE_TYPES.BUSH];
        if (level >= 2) {
            types.push(OBSTACLE_TYPES.DOUBLE);
        }
        if (level >= 4) {
            types.push(OBSTACLE_TYPES.DOUBLE);
            types.push(OBSTACLE_TYPES.DOUBLE);
        }
        const randomType = types[Math.floor(Math.random() * types.length)];
        obstacles.push(new Obstacle(randomType));
    }

    function restartGame() {
        gameRunning = true;
        score = 0;
        speed = 4;
        frame = 0;
        spawnCounter = 0;
        obstacles = [];
        capybara.y = 300;
        capybara.vy = 0;
        capybara.isJumping = false;
        capybara.runFrame = 0;
        gameOverMsg.textContent = '';
        document.getElementById('scoreDisplay').textContent = '0';
    }

    function gameOver() {
        gameRunning = false;
        gameOverMsg.textContent = '💀 Game Over!';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (!gameRunning) {
                restartGame();
                return;
            }
            capybara.jump();
        }
    });

    canvas.addEventListener('click', () => {
        if (!gameRunning) {
            restartGame();
        } else {
            capybara.jump();
        }
    });

    function update() {
        if (!gameRunning) return;

        frame++;
        if (frame % 6 === 0) {
            score++;
            scoreDisplay.textContent = score;
        }
        if (frame % 400 === 0 && speed < 12) {
            speed += 0.5;
        }

        spawnCounter++;
        const spawnInterval = Math.max(50, 80 - Math.floor(score / 50));
        if (spawnCounter >= spawnInterval + Math.random() * 40) {
            spawnObstacle();
            spawnCounter = 0;
        }

        capybara.update();
        const cap = capybara.getBounds();

        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.update();
            if (obs.isOffScreen()) {
                obstacles.splice(i, 1);
                continue;
            }
            const parts = obs.getPartsBounds();
            for (const part of parts) {
                if (rectCollide(cap, part)) {
                    if (part.requiresJump) {
                        const capBottom = cap.y + cap.height;
                        const partTop = part.y;
                        const isJumpingOver = (capBottom - 5 < partTop + 8);
                        if (!isJumpingOver) {
                            gameOver();
                            return;
                        }
                    } else {
                        // ===== မြက်ခုပ် - ခုန်ရင် Game Over =====
                        if (capybara.isJumping) {
                            gameOver();
                            return;
                        }
                    }
                }
            }
            if (!obs.passed && obs.isFullyPassed(cap.x)) {
                obs.passed = true;
                score += 10;
                scoreDisplay.textContent = score;
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, 800, 400);
        drawBackground();
        drawGround();
        obstacles.forEach(o => o.draw());
        capybara.draw();

        if (gameRunning && obstacles.length > 0) {
            const nearest = obstacles[0];
            if (nearest.x < 350) {
                const firstPart = nearest.parts[0];
                const alpha = Math.min(1, (350 - nearest.x) / 150);
                if (firstPart.requiresJump) {
                    ctx.fillStyle = `rgba(255,0,0,${alpha * 0.6})`;
                    ctx.font = 'bold 26px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('⚠️ ခုန်ပါ!', nearest.x + firstPart.width/2, GROUND_Y - firstPart.height - 10);
                    ctx.fillStyle = `rgba(255,200,0,${alpha * 0.7})`;
                    ctx.font = '32px Arial';
                    ctx.fillText('⬆', nearest.x + firstPart.width/2, GROUND_Y - firstPart.height - 45);
                } else {
                    ctx.fillStyle = `rgba(76,175,80,${alpha * 0.5})`;
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('✅ မခုန်ပဲဖြတ်ပါ', nearest.x + firstPart.width/2, GROUND_Y - firstPart.height - 10);
                    ctx.fillStyle = `rgba(255,200,0,${alpha * 0.5})`;
                    ctx.font = '20px Arial';
                    ctx.fillText('⬇', nearest.x + firstPart.width/2, GROUND_Y - firstPart.height - 40);
                }
            }
        }

        if (!gameRunning) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, 800, 400);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💀 Game Over', 400, 170);
            ctx.font = '20px Arial';
            ctx.fillText('အတားအဆီးကို မှားယွင်းစွာဖြတ်သွားတယ်!', 400, 220);
            ctx.font = '16px Arial';
            ctx.fillText('Space နှိပ်ပြီး ပြန်စပါ', 400, 260);
        }

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(680, 10, 110, 35);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText('🏆 ' + score, 775, 27);
        
        const level = Math.floor(score / 100) + 1;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(10, 10, 80, 30);
        ctx.fillStyle = 'white';
        ctx.font = '14px Arial';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('Level ' + level, 20, 27);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
