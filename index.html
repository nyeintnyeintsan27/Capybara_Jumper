<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capybara Runner 🐹</title>
    
    <!-- ===== PWA Manifest ===== -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="image.png">
    <meta name="theme-color" content="#16213e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .game-wrapper {
            background: #16213e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 2px solid #e94560;
            max-width: 860px;
            width: 100%;
        }
        canvas {
            border: 3px solid #e94560;
            border-radius: 12px;
            display: block;
            background: #87CEEB;
            cursor: pointer;
            width: 100%;
            height: auto;
            touch-action: none;
        }
        .ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            color: #eee;
            font-size: 18px;
            padding: 0 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .ui span {
            background: #0f3460;
            padding: 8px 20px;
            border-radius: 10px;
            border: 1px solid #e94560;
        }
        .ui button {
            padding: 10px 30px;
            font-size: 18px;
            font-weight: bold;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            touch-action: manipulation;
        }
        .ui button:active { transform: scale(0.95); }
        .controls {
            color: #aaa;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }
        .controls kbd {
            background: #0f3460;
            padding: 4px 12px;
            border-radius: 5px;
            border: 1px solid #e94560;
            color: #fff;
        }
        #gameOverMsg { color: #ff6b6b; font-weight: bold; font-size: 22px; }
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 8px;
            font-size: 13px;
            color: #ccc;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 20px; height: 16px; border-radius: 3px; }
        
        /* ===== Install Banner ===== */
        .install-banner {
            display: none;
            background: linear-gradient(135deg, #e94560, #c23152);
            padding: 14px 20px;
            border-radius: 12px;
            margin-top: 12px;
            text-align: center;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(233,69,96,0.3);
            border: none;
        }
        .install-banner:hover { transform: scale(1.02); }
        .install-banner:active { transform: scale(0.98); }
        .install-banner.show { display: block; }
        .install-banner .icon { font-size: 24px; margin-right: 12px; }
        
        @media (max-width: 600px) {
            .game-wrapper { padding: 10px; border-radius: 10px; }
            .ui { font-size: 14px; }
            .ui span { padding: 6px 14px; }
            .ui button { padding: 6px 16px; font-size: 14px; }
            .controls { font-size: 12px; }
            .legend { font-size: 11px; gap: 10px; }
            .install-banner { font-size: 14px; padding: 12px 16px; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="ui">
        <span>🏆 <span id="scoreDisplay">0</span></span>
        <span id="gameOverMsg"></span>
        <button onclick="restartGame()">🔄 Restart</button>
    </div>
    <div class="controls">
        <kbd>Space</kbd> သို့ <kbd>↑</kbd> နှိပ်ပြီး ခုန်ပါ။<br>
        <span style="font-size:12px;color:#888;">📱 Mobile: မျက်နှာပြင်ကို နှိပ်ပြီး ခုန်ပါ</span>
    </div>
    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#8D6E63;"></div><span>🧱 Jump</span></div>
        <div class="legend-item"><div class="legend-color" style="background:#4CAF50;"></div><span>🌿 Keep</span></div>
        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(90deg,#8D6E63,#4CAF50);"></div><span>⚠️ As You Like</span></div>
    </div>
    
    <!-- ===== Install Banner ===== -->
    <div id="installBanner" class="install-banner">
        <span class="icon">📲</span> အက်ပ်အဖြစ် ထည့်သွင်းရန် ဤနေရာကိုနှိပ်ပါ
    </div>
</div>

<script>
    // =============================================
    // ===== PWA INSTALL HANDLING =====
    // =============================================
    let deferredPrompt;
    const installBanner = document.getElementById('installBanner');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBanner.classList.add('show');
        console.log('📲 Install prompt ready!');
    });

    installBanner.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            if (result.outcome === 'accepted') {
                console.log('✅ User accepted install');
                installBanner.classList.remove('show');
            } else {
                console.log('❌ User declined install');
            }
            deferredPrompt = null;
        }
    });

    window.addEventListener('appinstalled', () => {
        console.log('🎉 App installed successfully!');
        installBanner.classList.remove('show');
    });

    // =============================================
    // ===== GAME CODE =====
    // =============================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const gameOverMsg = document.getElementById('gameOverMsg');

    // ===== Game State =====
    let gameRunning = true;
    let score = 0;
    let frame = 0;
    let speed = 4;
    let spawnCounter = 0;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -15.5;
    const GROUND_Y = 335;

    // =============================================
    // ===== ANIMATED CAPYBARA (Walking Animation) =====
    // =============================================
    const capybara = {
        x: 80,
        y: 300,
        width: 60,
        height: 45,
        vy: 0,
        isJumping: false,
        runFrame: 0,

        draw() {
            const cx = this.x + this.width/2;
            const cy = this.y + this.height/2 - 2;
            
            ctx.save();
            ctx.translate(cx, cy);
            
            // ===== ပြေးနေတဲ့အခါ ခန္ဓာကိုယ် လှုပ်ရှားမှု =====
            if (!this.isJumping) {
                const bob = Math.sin(this.runFrame * 0.15) * 1.5;
                const tilt = Math.sin(this.runFrame * 0.12) * 0.02;
                ctx.translate(0, bob);
                ctx.rotate(tilt);
            } else {
                ctx.rotate(-0.08);
            }
            
            // ===== ပန်းတွေ (Flowers on head) =====
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#FFB6C1';
            ctx.strokeStyle = '#FF69B4';
            ctx.lineWidth = 1;
            this.drawFlower(-8, -24, 5);
            this.drawFlower(0, -28, 6);
            this.drawFlower(8, -24, 5);
            
            // ===== Body (လုံးလုံးဝိုင်းဝိုင်း) =====
            ctx.shadowColor = 'rgba(0,0,0,0.15)';
            ctx.shadowBlur = 8;
            
            // Main body
            ctx.fillStyle = '#C68E4E';
            ctx.beginPath();
            ctx.ellipse(0, 4, 24, 18, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // အနောက်ဘက် ဝိုင်းနေတဲ့ အပိုင်း (ဖင်ပိုင်း)
            ctx.fillStyle = '#C68E4E';
            ctx.beginPath();
            ctx.ellipse(-12, 4, 12, 18, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Head
            ctx.fillStyle = '#D7A05B';
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.ellipse(12, -10, 16, 14, 0.1, 0, Math.PI * 2);
            ctx.fill();
            
            // Ears
            ctx.fillStyle = '#D7A05B';
            ctx.shadowBlur = 2;
            ctx.beginPath();
            ctx.ellipse(6, -22, 4, 7, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(18, -22, 4, 7, 0.3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            
            // Eyes
            ctx.fillStyle = '#2a1a0e';
            ctx.beginPath();
            ctx.arc(16, -12, 2.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Nose
            ctx.fillStyle = '#6B4F3A';
            ctx.beginPath();
            ctx.ellipse(25, -4, 6, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#4A3728';
            ctx.beginPath();
            ctx.arc(23, -4, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(27, -4, 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Mouth
            ctx.strokeStyle = '#4A3728';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(24, 1, 4, 0.1, 0.6);
            ctx.stroke();
            
            // ===== Legs (လမ်းလျှောက်ပုံ - ရှေ့နောက် လွှဲ) =====
            ctx.fillStyle = '#C68E4E';
            ctx.shadowBlur = 4;
            
            if (this.isJumping) {
                // ခုန်နေရင် ခြေထောက်တွေ ဆန့်ထား (ရှေ့နောက် အနေအထား)
                ctx.save();
                ctx.translate(-12, 14);
                ctx.rotate(-0.2);
                ctx.fillRect(-3, -4, 7, 12);
                ctx.restore();
                
                ctx.save();
                ctx.translate(-4, 14);
                ctx.rotate(0.2);
                ctx.fillRect(-3, -4, 7, 12);
                ctx.restore();
                
                ctx.save();
                ctx.translate(8, 14);
                ctx.rotate(-0.2);
                ctx.fillRect(-3, -4, 7, 12);
                ctx.restore();
                
                ctx.save();
                ctx.translate(16, 14);
                ctx.rotate(0.2);
                ctx.fillRect(-3, -4, 7, 12);
                ctx.restore();
            } else {
                // ပြေးနေရင် ခြေထောက်တွေ ရှေ့နောက် လွှဲ (Swinging Motion)
                const legPhase = this.runFrame * 0.15;
                const legOffset1 = Math.sin(legPhase) * 0.25; // ရှေ့နောက် ထောင့်ပြောင်း
                const legOffset2 = Math.sin(legPhase + Math.PI) * 0.25;
                
                // နောက်ခြေထောက် နှစ်ချောင်း (ဘယ်ဘက်)
                ctx.save();
                ctx.translate(-12, 14);
                ctx.rotate(legOffset1);
                ctx.fillRect(-3, -4, 7, 12);
                ctx.restore();
                
                ctx.save();
                ctx.translate(-4, 14);
                ctx.rotate(legOffset2);
                ctx.fillRect(-3, -4, 7, 12);
                ctx.restore();
                
                // ရှေ့ခြေထောက် နှစ်ချောင်း (ညာဘက်)
                ctx.save();
                ctx.translate(8, 14);
                ctx.rotate(legOffset2);
                ctx.fillRect(-3, -4, 7, 12);
                ctx.restore();
                
                ctx.save();
                ctx.translate(16, 14);
                ctx.rotate(legOffset1);
                ctx.fillRect(-3, -4, 7, 12);
                ctx.restore();
            }
            
            ctx.shadowBlur = 0;
            
            // Tail (အမြီး)
            ctx.fillStyle = '#C68E4E';
            ctx.beginPath();
            ctx.ellipse(-22, 4, 4, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            
            // ===== Running effects =====
            if (!this.isJumping && this.runFrame % 3 < 1.5) {
                ctx.fillStyle = 'rgba(200,200,200,0.12)';
                for (let i = 0; i < 2; i++) {
                    const dx = -8 - i * 10 + Math.sin(this.runFrame * 0.1 + i * 2) * 2;
                    const dy = 14 + i * 3 + Math.sin(this.runFrame * 0.15 + i * 3) * 2;
                    ctx.beginPath();
                    ctx.ellipse(this.x + dx, this.y + dy, 5 - i * 1.5, 2 - i * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // ===== Jump shadow =====
            if (this.isJumping) {
                ctx.fillStyle = 'rgba(0,0,0,0.08)';
                ctx.beginPath();
                ctx.ellipse(this.x + this.width/2, this.y + this.height + 6, 16, 4, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        },

        drawFlower(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(0, 0, size/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFB6C1';
            for (let i = 0; i < 5; i++) {
                const angle = (i * Math.PI * 2) / 5;
                ctx.beginPath();
                ctx.ellipse(Math.cos(angle) * size, Math.sin(angle) * size, size/1.5, size/2, angle, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        },

        jump() {
            if (!this.isJumping) {
                this.vy = JUMP_FORCE;
                this.isJumping = true;
            }
        },

        update() {
            this.vy += GRAVITY;
            this.y += this.vy;
            if (this.y >= 300) {
                this.y = 300;
                this.vy = 0;
                this.isJumping = false;
            }
            if (!this.isJumping) {
                this.runFrame += 1;
            }
        },

        getBounds() {
            return {
                x: this.x + 6,
                y: this.y + 6,
                width: this.width - 12,
                height: this.height - 8
            };
        }
    };

    // ===== Obstacles =====
    const OBSTACLE_TYPES = { WALL: 'wall', BUSH: 'bush', DOUBLE: 'double' };
    let obstacles = [];

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.x = 820;
            this.passed = false;
            this.parts = [];
            switch(type) {
                case OBSTACLE_TYPES.WALL:
                    this.parts.push({ x: 0, width: 30, height: 75, y: 0, requiresJump: true, label: '🧱' });
                    break;
                case OBSTACLE_TYPES.BUSH:
                    this.parts.push({ x: 0, width: 50, height: 30, y: 60, requiresJump: false, label: '🌿' });
                    break;
                case OBSTACLE_TYPES.DOUBLE:
                    this.parts.push({ x: 0, width: 30, height: 75, y: 0, requiresJump: true, label: '🧱' });
                    this.parts.push({ x: 50, width: 45, height: 30, y: 70, requiresJump: false, label: '🌿' });
                    break;
            }
        }

        draw() {
            this.parts.forEach(part => {
                const px = this.x + part.x;
                const py = GROUND_Y - part.height - (part.y || 0);
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 6;
                if (part.requiresJump) {
                    const grad = ctx.createLinearGradient(px, py, px + part.width, py);
                    grad.addColorStop(0, '#8D6E63');
                    grad.addColorStop(0.5, '#A1887F');
                    grad.addColorStop(1, '#8D6E63');
                    ctx.fillStyle = grad;
                    ctx.fillRect(px, py, part.width, part.height);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#5D4037';
                    ctx.lineWidth = 1.5;
                    for (let row = 0; row < 6; row++) {
                        const ry = py + row * 13;
                        ctx.beginPath();
                        ctx.moveTo(px, ry);
                        ctx.lineTo(px + part.width, ry);
                        ctx.stroke();
                    }
                    for (let row = 0; row < 6; row++) {
                        const offset = row % 2 === 0 ? 0 : part.width / 2;
                        for (let col = 0; col < 2; col++) {
                            const lx = px + col * (part.width / 2) + offset;
                            const ry = py + row * 13;
                            ctx.beginPath();
                            ctx.moveTo(lx, ry);
                            ctx.lineTo(lx, ry + 13);
                            ctx.stroke();
                        }
                    }
                    ctx.fillStyle = '#4E342E';
                    ctx.fillRect(px, py + part.height - 2, part.width, 2);
                    if (this.x < 400) {
                        ctx.fillStyle = `rgba(255,0,0,${0.08 + (1 - this.x/400) * 0.12})`;
                        ctx.fillRect(px - 5, py - 5, part.width + 10, part.height + 10);
                    }
                } else {
                    ctx.fillStyle = '#388E3C';
                    ctx.beginPath();
                    ctx.ellipse(px + part.width/2, py + part.height/2 + 2, part.width/2.2, part.height/2.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#43A047';
                    ctx.beginPath();
                    ctx.ellipse(px + part.width/3, py + part.height/2 - 2, part.width/4.5, part.height/3.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#66BB6A';
                    ctx.beginPath();
                    ctx.ellipse(px + part.width*2/3, py + part.height/2 + 4, part.width/4.5, part.height/3.8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FF6B6B';
                    ctx.beginPath();
                    ctx.arc(px + 10, py + 14, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFD93D';
                    ctx.beginPath();
                    ctx.arc(px + 10, py + 14, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FF6B6B';
                    ctx.beginPath();
                    ctx.arc(px + 35, py + 10, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFD93D';
                    ctx.beginPath();
                    ctx.arc(px + 35, py + 10, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,0,0,0.15)';
                    ctx.fillRect(px, py + part.height - 2, part.width, 2);
                }
                ctx.shadowBlur = 0;
                ctx.font = '18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.fillText(part.label, px + part.width/2, py - 5);
            });
            ctx.shadowBlur = 0;
        }

        update() { this.x -= speed; }
        getPartsBounds() {
            return this.parts.map(part => {
                const px = this.x + part.x;
                const py = GROUND_Y - part.height - (part.y || 0);
                return { x: px + 2, y: py + 2, width: part.width - 4, height: part.height - 4, requiresJump: part.requiresJump };
            });
        }
        isOffScreen() { return this.x < -100; }
        isFullyPassed(capX) {
            const lastPart = this.parts[this.parts.length - 1];
            return capX > this.x + lastPart.x + lastPart.width + 10;
        }
    }

    // ===== Ground & Background =====
    let groundOffset = 0;
    function drawGround() {
        ctx.fillStyle = '#5D8A3C';
        ctx.fillRect(0, GROUND_Y, 800, 65);
        ctx.fillStyle = '#7CB342';
        for (let i = 0; i < 20; i++) {
            const x = (i * 42 + groundOffset) % 820 - 20;
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 5, GROUND_Y - 15);
            ctx.lineTo(x + 5, GROUND_Y - 15);
            ctx.closePath();
            ctx.fill();
        }
        ctx.fillStyle = '#4A7A2A';
        ctx.fillRect(0, GROUND_Y + 2, 800, 3);
        groundOffset = (groundOffset - speed) % 42;
    }

    function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        gradient.addColorStop(0, '#4A90D9');
        gradient.addColorStop(1, '#87CEEB');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 800, GROUND_Y);
        ctx.fillStyle = '#FFD93D';
        ctx.shadowColor = '#FFD93D';
        ctx.shadowBlur = 40;
        ctx.beginPath();
        ctx.arc(720, 50, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        const cloudX = (frame * 0.3) % 900 - 100;
        ctx.beginPath();
        ctx.arc(cloudX, 60, 30, 0, Math.PI * 2);
        ctx.arc(cloudX + 30, 50, 25, 0, Math.PI * 2);
        ctx.arc(cloudX + 55, 60, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cloudX + 300, 100, 25, 0, Math.PI * 2);
        ctx.arc(cloudX + 325, 90, 20, 0, Math.PI * 2);
        ctx.arc(cloudX + 350, 100, 22, 0, Math.PI * 2);
        ctx.fill();
    }

    function rectCollide(r1, r2) {
        return r1.x < r2.x + r2.width && r1.x + r1.width > r2.x &&
               r1.y < r2.y + r2.height && r1.y + r1.height > r2.y;
    }

    function spawnObstacle() {
        const level = Math.floor(score / 100);
        let types = [OBSTACLE_TYPES.WALL, OBSTACLE_TYPES.BUSH];
        if (level >= 2) types.push(OBSTACLE_TYPES.DOUBLE);
        if (level >= 4) { types.push(OBSTACLE_TYPES.DOUBLE); types.push(OBSTACLE_TYPES.DOUBLE); }
        obstacles.push(new Obstacle(types[Math.floor(Math.random() * types.length)]));
    }

    function restartGame() {
        gameRunning = true; score = 0; speed = 4; frame = 0; spawnCounter = 0;
        obstacles = [];
        capybara.y = 300; capybara.vy = 0; capybara.isJumping = false; capybara.runFrame = 0;
        gameOverMsg.textContent = '';
        document.getElementById('scoreDisplay').textContent = '0';
    }

    function gameOver() { gameRunning = false; gameOverMsg.textContent = '💀 Game Over!'; }

    // ===== Controls (Keyboard + Touch) =====
    document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (!gameRunning) { restartGame(); return; }
            capybara.jump();
        }
    });

    canvas.addEventListener('click', (e) => {
        e.preventDefault();
        if (!gameRunning) { restartGame(); } else { capybara.jump(); }
    });

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning) { restartGame(); } else { capybara.jump(); }
    }, { passive: false });

    function update() {
        if (!gameRunning) return;
        frame++;
        if (frame % 6 === 0) { score++; scoreDisplay.textContent = score; }
        if (frame % 400 === 0 && speed < 12) speed += 0.5;

        spawnCounter++;
        const spawnInterval = Math.max(50, 80 - Math.floor(score / 50));
        if (spawnCounter >= spawnInterval + Math.random() * 40) {
            spawnObstacle();
            spawnCounter = 0;
        }

        capybara.update();
        const cap = capybara.getBounds();

        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.update();
            if (obs.isOffScreen()) { obstacles.splice(i, 1); continue; }
            const parts = obs.getPartsBounds();
            for (const part of parts) {
                if (rectCollide(cap, part)) {
                    if (part.requiresJump) {
                        const capBottom = cap.y + cap.height;
                        const partTop = part.y;
                        const isJumpingOver = (capBottom - 5 < partTop + 8);
                        if (!isJumpingOver) { gameOver(); return; }
                    } else {
                        if (capybara.isJumping) { gameOver(); return; }
                    }
                }
            }
            if (!obs.passed && obs.isFullyPassed(cap.x)) {
                obs.passed = true;
                score += 10;
                scoreDisplay.textContent = score;
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, 800, 400);
        drawBackground();
        drawGround();
        obstacles.forEach(o => o.draw());
        capybara.draw();

        if (gameRunning && obstacles.length > 0) {
            const nearest = obstacles[0];
            if (nearest.x < 350) {
                const firstPart = nearest.parts[0];
                const alpha = Math.min(1, (350 - nearest.x) / 150);
                if (firstPart.requiresJump) {
                    ctx.fillStyle = `rgba(255,0,0,${alpha * 0.6})`;
                    ctx.font = 'bold 26px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('⚠️ ခုန်ပါ!', nearest.x + firstPart.width/2, GROUND_Y - firstPart.height - 10);
                    ctx.fillStyle = `rgba(255,200,0,${alpha * 0.7})`;
                    ctx.font = '32px Arial';
                    ctx.fillText('⬆', nearest.x + firstPart.width/2, GROUND_Y - firstPart.height - 45);
                } else {
                    ctx.fillStyle = `rgba(76,175,80,${alpha * 0.5})`;
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('✅ မခုန်ပဲဖြတ်ပါ', nearest.x + firstPart.width/2, GROUND_Y - firstPart.height - 10);
                    ctx.fillStyle = `rgba(255,200,0,${alpha * 0.5})`;
                    ctx.font = '20px Arial';
                    ctx.fillText('⬇', nearest.x + firstPart.width/2, GROUND_Y - firstPart.height - 40);
                }
            }
        }

        if (!gameRunning) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, 800, 400);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💀 Game Over', 400, 170);
            ctx.font = '20px Arial';
            ctx.fillText('အတားအဆီးကို မှားယွင်းစွာဖြတ်သွားတယ်!', 400, 220);
            ctx.font = '16px Arial';
            ctx.fillText('Space နှိပ်ပြီး ပြန်စပါ', 400, 260);
        }

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(680, 10, 110, 35);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText('🏆 ' + score, 775, 27);
        
        const level = Math.floor(score / 100) + 1;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(10, 10, 80, 30);
        ctx.fillStyle = 'white';
        ctx.font = '14px Arial';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('Level ' + level, 20, 27);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
